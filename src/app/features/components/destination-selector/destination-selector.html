<section class="search" role="dialog" aria-label="Find a destination">
  <div class="search__bar">
    <button type="button" class="search__icon-btn" aria-label="Back" (click)="closed.emit()">
      <span class="mi">arrow_back</span>
    </button>
    <div class="search__field">
      <span class="mi search__field-icon">search</span>
      <input
        #searchInput
        type="search"
        class="search__input"
        placeholder="Where do you want to go?"
        autocomplete="off"
        enterkeyhint="search"
        [value]="searchTerm()"
        (input)="searchTerm.set($any($event.target).value)"
        (keydown.escape)="closed.emit()"
        (keydown.enter)="rows().length === 1 && choose(rows()[0].destination)"
      />
      @if (searchTerm()) {
        <button type="button" class="search__clear" aria-label="Clear search" (click)="clear()">
          <span class="mi">close</span>
        </button>
      }
    </div>
  </div>

  <ul class="search__list">
    @for (row of rows(); track row.destination.nodeId) {
      <li>
        <button type="button" class="search__row" (click)="choose(row.destination)">
          <span class="search__row-icon mi" [style.color]="row.icon.color" [style.background]="row.icon.color + '1A'">
            {{ row.icon.icon }}
          </span>
          <span class="search__row-text">
            <span class="search__row-name">{{ row.destination.name }}</span>
            <span class="search__row-meta">{{ row.meta }}</span>
          </span>
          <span class="mi search__row-go">chevron_right</span>
        </button>
      </li>
    } @empty {
      <li class="search__empty">
        <span class="mi">search_off</span>
        @if (searchTerm()) {
          <p>No places match “{{ searchTerm() }}”.</p>
        } @else {
          <p>This venue has no destinations yet.</p>
        }
      </li>
    }
  </ul>
</section>
