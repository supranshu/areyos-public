<section class="sheet welcome">
  <div class="welcome__head">
    <span class="welcome__badge mi">waving_hand</span>
    <div>
      <p class="welcome__title">Welcome to {{ venue().name }}</p>
      <p class="welcome__where">
        You are at <strong>{{ startPoint().name }}</strong>
        ({{ startPoint().floorName }}, {{ floorCode(startPoint().floorNumber) }})
      </p>
    </div>
  </div>

  <button type="button" class="welcome__search" (click)="search.emit()">
    <span class="mi">search</span>
    <span>Where do you want to go?</span>
  </button>
</section>
